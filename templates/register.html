{% extends "base.html" %}{% block content %}
<div class="auth"><div class="in"><h1>Plan the term, <span class="hl">one deadline at a time.</span></h1>
<p>Create your StudyTrack account.</p>
<form method="post"><input name="name" placeholder="Your name" required>
<input name="email" type="email" placeholder="name@college.edu" required>
<input name="password" type="password" placeholder="Password, 6+ characters" required>
<button class="btn">Create account</button></form>
<p style="margin-top:16px">Have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></div>{% endblock %}
