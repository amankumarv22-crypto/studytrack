{% extends "base.html" %}{% block content %}
<div class="auth"><div class="in"><h1>Know what's due <span class="hl">before it's late.</span></h1>
<p>Log in to your StudyTrack.</p>
<form method="post"><input name="email" type="email" placeholder="name@college.edu" required>
<input name="password" type="password" placeholder="Password" required>
<button class="btn">Log in</button></form>
<a href="{{ url_for('demo') }}" class="btn" style="display:block;text-align:center;text-decoration:none;background:var(--hl);color:#14213d">Try the demo</a>
<p style="margin-top:16px">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
